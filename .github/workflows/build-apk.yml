
name: Build Budget Buddy 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Budget Buddy APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Setup Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # 6. Verify project ZIP
      - name: Verify project ZIP
        run: |
          echo "Checking project ZIP..."
          ls -lah
          test -f Budget_Buddy_2_0_Android_Project.zip
          echo "Project ZIP found successfully."

      # 7. Extract Android project
      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted

          unzip -o Budget_Buddy_2_0_Android_Project.zip -d extracted

          echo "Searching for Android project..."

          PROJECT_DIR=$(find extracted -type f -name settings.gradle -printf '%h\n' -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Project found at: $PROJECT_DIR"

          # Verify required project files
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/vimal/mymoney/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/vimal/mymoney/FinanceDb.java"

          # Make project path available to later steps
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "All project files verified successfully."

      # 8. Build APK
      - name: Build Budget Buddy Debug APK
        run: |
          echo "Building Budget Buddy APK..."

          gradle \
            -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      # 9. Verify generated APK
      - name: Verify generated APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 10. Upload APK
      - name: Upload Budget Buddy APK
        uses: actions/upload-artifact@v7
        with:
          name: Budget-Buddy-2.0-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
