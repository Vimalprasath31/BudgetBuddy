
name: Build Budget Buddy 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Budget Buddy APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install required SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Setup compatible Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # 6. Check project ZIP
      - name: Verify project ZIP
        run: |
          echo "Checking project ZIP..."
          ls -lah
          test -f Budget_Buddy_2_0_Android_Project.zip

      # 7. Extract project
      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o Budget_Buddy_2_0_Android_Project.zip -d extracted

          echo "Checking project files..."
          test -f extracted/MyMoneyAndroid/settings.gradle
          test -f extracted/MyMoneyAndroid/build.gradle
          test -f extracted/MyMoneyAndroid/app/build.gradle
          test -f extracted/MyMoneyAndroid/app/src/main/AndroidManifest.xml
          test -f extracted/MyMoneyAndroid/app/src/main/java/com/vimal/mymoney/MainActivity.java

      # 8. Build APK
      - name: Build Budget Buddy Debug APK
        run: |
          gradle \
            -p extracted/MyMoneyAndroid \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      # 9. Verify APK
      - name: Verify generated APK
        run: |
          APK="extracted/MyMoneyAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 10. Upload APK
      - name: Upload Budget Buddy APK
        uses: actions/upload-artifact@v7
        with:
          name: Budget-Buddy-2.0-APK
          path: extracted/MyMoneyAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
