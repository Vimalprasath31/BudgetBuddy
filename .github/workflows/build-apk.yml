
name: Build My Money APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          unzip -o My_Money_Android_Studio_Project.zip -d extracted
          gradle -p extracted/MyMoneyAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Money-APK
          path: extracted/MyMoneyAndroid/app/build/outputs/apk/debug/app-debug.apk
