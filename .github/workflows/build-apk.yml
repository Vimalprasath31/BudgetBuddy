name: Build Budget Buddy 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Verify ZIP
      - name: Check project ZIP
        run: |
          ls -lah
          test -f Budget_Buddy_2_0_Android_Project.zip

      # 7. Extract project
      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o Budget_Buddy_2_0_Android_Project.zip -d extracted
          ls -lah extracted/MyMoneyAndroid

      # 8. Build APK
      - name: Build Budget Buddy APK
        run: |
          gradle -p extracted/MyMoneyAndroid \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 9. Verify APK
      - name: Verify APK
        run: |
          test -f extracted/MyMoneyAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh extracted/MyMoneyAndroid/app/build/outputs/apk/debug/app-debug.apk

      # 10. Upload APK
      - name: Upload Budget Buddy APK
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Buddy-2.0-APK
          path: extracted/MyMoneyAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
