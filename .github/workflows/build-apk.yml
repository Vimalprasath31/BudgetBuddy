name: Build Budget Buddy 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Install required Android packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Step 5: Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Step 6: Extract Budget Buddy project
      - name: Extract Budget Buddy 2.0 project
        run: |
          unzip -o Budget_Buddy_2_0_Android_Project.zip -d extracted

      # Step 7: Build APK
      - name: Build Budget Buddy Debug APK
        run: |
          gradle -p extracted/MyMoneyAndroid assembleDebug

      # Step 8: Upload APK
      - name: Upload Budget Buddy APK
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Buddy-2.0-APK
          path: extracted/MyMoneyAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
